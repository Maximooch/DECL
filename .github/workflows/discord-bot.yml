name: Discord bot

on:
  pull_request:
    paths:
      - "discord-bot/**"
      - ".github/workflows/discord-bot.yml"
  push:
    branches: [main]
    paths:
      - "discord-bot/**"
      - ".github/workflows/discord-bot.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: discord-bot/package-lock.json
      - run: npm ci
      - run: npm test
      - run: docker build --target test .
      - run: docker build .
